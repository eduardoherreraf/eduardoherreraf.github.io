<!DOCTYPE html><html lang=es><meta charset=UTF-8><meta name=viewport content="width=device-width, initial-scale=1.0"><title>Footer Pegado al Fondo</title><style>*{box-sizing:border-box;margin:0;padding:0}.demo-sticky-footer{flex-direction:column;min-height:100vh;font-family:Arial,sans-serif;display:flex}.demo-sticky-footer__header{color:#fff;text-align:center;background:#2c3e50;padding:1.5rem}.demo-sticky-footer__main{background:#ecf0f1;flex:1;height:300px;padding:2rem}.demo-sticky-footer__content-box{background:#fff;border-radius:8px;padding:2rem;box-shadow:0 2px 4px #0000001a}.demo-sticky-footer__footer{text-align:center;background:#34495e;padding:1.5rem}.demo-sticky-footer__footer .demo-sticky-footer__p{color:#fff}.demo-sticky-footer__h1{margin-bottom:1rem}.demo-sticky-footer__p{color:#000;line-height:1.6}.demo-sticky-footer__highlight{color:#fff;background:#3498db;border-radius:4px;padding:.2rem .5rem}</style><body class=demo-sticky-footer>
  <header class=demo-sticky-footer__header>
    <h1 class=demo-sticky-footer__h1>Header</h1>
  </header>

  <main class=demo-sticky-footer__main>
    <div class=demo-sticky-footer__content-box>
      <h2>Main con altura de 300px</h2>
      <p class=demo-sticky-footer__p>Aunque el contenido principal sea corto (300px), el <span class=demo-sticky-footer__highlight>flex: 1</span> hace que el footer
        se mantenga pegado al fondo de la pantalla.</p>
      <p style=margin-top:1rem class=demo-sticky-footer__p>Prueba redimensionar la ventana verticalmente y verás que el footer siempre está
        abajo.</p>
    </div>
  </main>

  <footer class=demo-sticky-footer__footer>
    <p class=demo-sticky-footer__p>Footer siempre pegado al fondo.</p>
  </footer>
